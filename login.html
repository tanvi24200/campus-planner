<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SSIEMS  Staff Login</title>

<style>
/* ---------- GLOBAL RESET ---------- */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

/* ---------- SAME BACKGROUND THEME ---------- */
body {
    background: linear-gradient(135deg, #e8eef7, #cfd7e6);
    min-height: 100vh;
}

/* ---------- NAVBAR (UNCHANGED) ---------- */
nav {
    width: 100%;
    background: #0d47a1;
    padding: 16px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: white;
}
nav ul {
    list-style: none;
    display: flex;
    gap: 26px;
}
nav ul li a {
    text-decoration: none;
    color: white;
    font-size: 16px;
}
nav ul li a:hover {
    opacity: 0.7;
}
.logo {
    color: white;
    font-size: 22px;
}

/* ---------- LOGIN BOX (MATCHES ABOUT PAGE CARD) ---------- */
.login-box {
    width: 360px;
    margin: 80px auto;
    padding: 25px;
    background: rgba(255, 255, 255, 0.88);
    border-radius: 15px;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    animation: fadeIn 0.9s ease-out;
}

/* ---------- HEADINGS ---------- */
h2 {
    text-align: center;
    margin-bottom: 15px;
    color: #0d47a1;
    font-size: 26px;
}

/* ---------- FORM FIELDS ---------- */
label {
    font-size: 15px;
    margin-top: 12px;
    display: block;
    color: #333;
}
input {
    width: 100%;
    padding: 12px;
    border: 1px solid #bbb;
    border-radius: 8px;
    margin-top: 5px;
    font-size: 15px;
}

/* ---------- BUTTON ---------- */
button {
    width: 100%;
    padding: 12px;
    margin-top: 22px;
    border: none;
    background: #0d47a1;
    color: white;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
}
button:hover {
    background: #1565c0;
}

/* ---------- ERROR TEXT ---------- */
#error {
    color: red;
    text-align: center;
    margin-top: 10px;
    font-size: 14px;
}

/* ---------- SMOOTH FADE ANIMATION ---------- */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<nav>
    <h2 class="logo">SSIEMS Academic Year timetable</h2>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="timetable.html">Timetable</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="login.html">Login</a></li>
    </ul>
</nav>

<div class="login-box">
    <h2>Staff Login</h2>

    <label>Username</label>
    <input type="text" id="username">

    <label>Password</label>
    <input type="password" id="password">

    <button onclick="login()">Login</button>

    <p id="error"></p>
</div>

<script>
function login(){
    const u = document.getElementById("username").value.trim();
    const p = document.getElementById("password").value.trim();

    if(u === "staff" && p === "1234"){
        localStorage.setItem("loggedIn", "true");
        window.location.href = "timetable.html";
    } else {
        document.getElementById("error").textContent = "Invalid login!";
    }
}
</script>

</body>
</html>
