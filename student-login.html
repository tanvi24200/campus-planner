<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login | SSEMIS</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {
    background: linear-gradient(135deg, #e8eef7, #cfd7e6);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-box {
    background: rgba(255,255,255,0.9);
    padding: 35px 30px;
    border-radius: 15px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    width: 350px;
    text-align: center;
}

.login-box h2 {
    color: #0d47a1;
    margin-bottom: 25px;
}

.login-box input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border-radius: 8px;
    border: 1px solid #bbb;
    font-size: 15px;
}

.login-box button {
    width: 100%;
    padding: 10px;
    margin-top: 12px;
    background: #0d47a1;
    color: white;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

.login-box button:hover {
    opacity: 0.85;
}
</style>
</head>
<body>

<div class="login-box">
    <h2>Student Login</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="studentLogin()">Login</button>
</div>

<script>
function studentLogin() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();

    // Example credentials, replace with your own
    if(username === "student" && password === "1234") {
        localStorage.setItem("studentLoggedIn", "true"); // mark as logged in
        alert("Login successful!");
        window.location.href = "timetable.html"; // redirect to timetable
    } else {
        alert("Invalid username or password!");
    }
}
</script>

</body>
</html>
